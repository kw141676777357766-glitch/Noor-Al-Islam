name: Build Android APK

on:
  push:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable

      - name: Create Android platform files
        run: flutter create . --platforms=android --project-name=noor_islam

      - name: Set Android minimum SDK
        run: |
          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle

      - name: Add location permissions
        run: |
          python - <<'PYTHON'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
          ]

          pos = s.find("<application")
          if pos < 0:
              raise SystemExit("ERROR: application tag not found")

          missing = [x for x in permissions if x not in s]

          if missing:
              s = s[:pos] + "\n".join(missing) + "\n    " + s[pos:]
              p.write_text(s)

          print("Location permissions ready.")
          PYTHON

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
