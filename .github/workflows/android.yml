name: Build Android APK

on:
  push:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: stable

      - name: Create Missing Platform Files
        run: flutter create . --platforms=android --project-name=noor_islam

      - name: Update Android Min SDK Version
        run: |
          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle

      - name: Update Kotlin Version
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle")
          build = Path("android/build.gradle")

          pattern = r"(id\s+['\"]org\.jetbrains\.kotlin\.android['\"]\s+version\s+['\"])[^'\"]+(['\"])"

          if settings.exists():
              content = settings.read_text()
              updated, count = re.subn(pattern, r"\g<1>1.9.22\2", content, count=1)
              if count:
                  settings.write_text(updated)
                  print("Kotlin updated in settings.gradle to 1.9.22")
                  raise SystemExit(0)

          if build.exists():
              content = build.read_text()
              updated, count = re.subn(
                  r"ext\.kotlin_version\s*=\s*['\"][^'\"]+['\"]",
                  "ext.kotlin_version = '1.9.22'",
                  content,
                  count=1
              )
              if count:
                  build.write_text(updated)
                  print("Kotlin updated in build.gradle to 1.9.22")
                  raise SystemExit(0)

          raise SystemExit("ERROR: Kotlin version declaration was not found")
          PYTHON

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
