name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # إعداد بيئة فلاتر الرسمية
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      # تثبيت الاعتمادات والحزم
      - name: Install dependencies
        run: flutter pub get

      # توليد أيقونة التطبيق تلقائياً عبر الحزمة التي أضفناها
      - name: Generate Icon
        run: flutter pub run flutter_launcher_icons

      # بناء وتوليد ملف الـ APK النهائي
      - name: Build APK
        run: flutter build apk --release

      # رفع ملف الـ APK ليصبح جاهزاً للتحميل
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
