name: noor_islam
description: A complete Islamic mobile application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  just_audio: ^0.9.36
  shared_preferences: ^2.2.2
  flutter_compass: ^0.8.1
  audio_service: ^0.18.15
  flutter_local_notifications: ^17.2.0
  http: ^1.2.2
  path_provider: ^2.1.4
  geolocator: 12.0.0
  adhan_dart: ^1.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/prophets.json
    - assets/data/quran.json
    - assets/data/adhkar.json

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  image_path_android: "assets/icon/icon.png"

dependency_overrides:
  geolocator_android: 4.6.1
